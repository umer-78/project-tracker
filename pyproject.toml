[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker"
version = "1.0.0"
description = "Team project tracker: projects, sprints, a kanban board, workload and burndown, with a FastAPI backend and SQLite."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Umer Hashmi" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8", "httpx>=0.27", "httpx2>=2.0"]

[project.scripts]
tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracker = ["../../web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# An explicit rule set, rather than whatever the newest ruff turns on by default:
# an unpinned linter with implicit rules means CI breaks on someone else's release
# schedule, not on a change to this code.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI expresses dependency injection as a call in an argument default —
# `user: User = Depends(current_user)`. B008 reads that as a mutable default
# evaluated once at import, which is exactly what it is; FastAPI resolves it per
# request instead. It is the framework's documented idiom, not a bug here.
"src/tracker/api.py" = ["B008"]
