name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Start the app and check it answers
        run: |
          tracker --db ci.db demo
          tracker --db ci.db serve --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break || sleep 1; done
          curl -sf localhost:8000/ | grep -q "Project Tracker"
          TOKEN=$(curl -sf -X POST localhost:8000/api/login -H 'content-type: application/json' \
            -d '{"email":"umer@example.com","password":"password123"}' | python -c "import sys,json;print(json.load(sys.stdin)['token'])")
          curl -sf localhost:8000/api/workload -H "authorization: Bearer $TOKEN" | grep -q open_hours
